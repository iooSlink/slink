name: Publish Slink Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  publish:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout download site
        uses: actions/checkout@v4
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Fetch browser build
        run: |
          mkdir -p _site/play
          curl -fL --retry 3 https://github.com/iooSlink/slink/releases/download/v1.1.0/Slink-web.zip -o /tmp/Slink-web.zip
          unzip -q /tmp/Slink-web.zip -d _site/play
          cp index.html _site/index.html
          touch _site/.nojekyll
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - name: Deploy Pages
        id: deployment
        uses: actions/deploy-pages@v4
